<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professor Marcos Marinho</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;

    background:linear-gradient(180deg,#f3f7fd,#eaf2ff);

    color:#0f172a;

}

/*==========================
CABEÇALHO
===========================*/

header{

    background:#0b1e45;

    color:#fff;

    text-align:center;

    padding:26px 18px;

    box-shadow:0 4px 16px rgba(0,0,0,.15);

}

header h1{

    font-size:44px;

    font-weight:900;

    margin-bottom:12px;

}

header a{

    color:#ffffff;

    text-decoration:none;

    font-size:28px;

    font-weight:700;

    border-bottom:3px solid rgba(255,255,255,.35);

    padding-bottom:6px;

}

header a:hover{

    border-bottom-color:#fff;

}

/*==========================
ÁREA PRINCIPAL
===========================*/

main{

    width:100%;

    max-width:760px;

    margin:24px auto 40px;

    padding:0 18px;

}

/*==========================
PAINEL
===========================*/

.panel{

    background:#ffffff;

    border-radius:30px;

    padding:26px;

    box-shadow:0 18px 45px rgba(0,0,0,.15);

    border:1px solid rgba(0,0,0,.08);

}

/*==========================
MENU
===========================*/

.menu{

    display:flex;

    flex-direction:column;

    gap:24px;

}

/*==========================
BOTÕES
===========================*/

.btn{

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    min-height:145px;

    padding:22px;

    background:#156b88;

    color:#fff;

    text-decoration:none;

    font-size:38px;

    font-weight:900;

    line-height:1.15;

    border-radius:38px;

    border:3px solid rgba(255,255,255,.18);

    box-shadow:

        inset 0 0 0 2px rgba(255,255,255,.12),

        0 10px 18px rgba(0,0,0,.18);

    transition:.18s;

}

.btn:hover{

    transform:translateY(-3px);

    background:#19799a;

}

.btn:active{

    transform:translateY(1px);

}

/*==========================
TABLET
===========================*/

@media(max-width:900px){

header h1{

    font-size:34px;

}

header a{

    font-size:22px;

}

.btn{

    font-size:31px;

    min-height:128px;

}

}

/*==========================
CELULAR
===========================*/

@media(max-width:600px){

header{

    padding:22px 12px;

}

header h1{

    font-size:24px;

}

header a{

    font-size:17px;

}

main{

    margin-top:14px;

    padding:0 10px;

}

.panel{

    padding:18px;

    border-radius:22px;

}

.menu{

    gap:18px;

}

.btn{

    min-height:108px;

    border-radius:28px;

    font-size:22px;

    padding:18px;

}

}

</style>

</head>

<body>

<header>

<h1>Professor Marcos Marinho</h1>

<a href="http://lattes.cnpq.br/9869114671337490"
target="_blank">

Currículo Lattes

</a>

</header>

<main>

<div class="panel">

<div class="menu">

<a class="btn"
href="direito-individual-e-coletivo-do-trabalho/">

Direito do Trabalho

</a>

<a class="btn"
href="direito-processual-do-trabalho/">

Direito Processual<br>
do Trabalho

</a>

<a class="btn"
href="pratica-juridica-trabalhista/">

Prática Jurídica<br>
Trabalhista

</a>

</div>

</div>

</main>

</body>
</html>
