<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Professor Marcos Marinho</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }

  body{
    font-family:"Inter", system-ui, sans-serif;
    background:#f1f5f9;
    color:#0f172a;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* fundo animado */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 800px 600px at 0% 0%,   rgba(37,99,235,.13) 0%, transparent 65%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(124,58,237,.11) 0%, transparent 65%),
      radial-gradient(ellipse 600px 400px at 50% 60%,  rgba(5,150,105,.08) 0%, transparent 65%);
    pointer-events:none;
    z-index:0;
  }

  /* ===== CABEÇALHO ===== */
  header{
    position:relative;
    z-index:1;
    background:linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    color:#fff;
    text-align:center;
    padding:48px 24px 40px;
    box-shadow:0 4px 30px rgba(0,0,0,.25);
  }

  /* fio decorativo superior */
  header::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:4px;
    background:linear-gradient(90deg, #2563eb, #7c3aed, #dc2626, #059669, #d97706);
  }

  .header-inner{
    max-width:680px;
    margin:0 auto;
  }

  header h1{
    font-family:"Fraunces", Georgia, serif;
    font-size:clamp(1.9rem, 6vw, 3.2rem);
    font-weight:700;
    letter-spacing:-.02em;
    line-height:1.1;
    margin-bottom:6px;
    background:linear-gradient(135deg, #e2e8f0, #ffffff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  header .sub{
    font-size:13px;
    font-weight:500;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:rgba(255,255,255,.5);
    margin-bottom:24px;
  }

  header a.lattes{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.2);
    border-radius:99px;
    padding:10px 22px;
    font-size:14px;
    font-weight:700;
    color:#fff;
    letter-spacing:.03em;
    transition:background .2s, transform .2s;
    backdrop-filter:blur(4px);
  }
  header a.lattes:hover{
    background:rgba(255,255,255,.18);
    transform:translateY(-2px);
  }
  header a.lattes .lattes-icon{
    font-size:16px;
  }

  /* ===== MAIN ===== */
  main{
    position:relative;
    z-index:1;
    flex:1;
    max-width:680px;
    width:100%;
    margin:0 auto;
    padding:36px 18px 56px;
  }

  .section-label{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
  }
  .section-label span{
    font-size:11px;
    font-weight:700;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:#475569;
    white-space:nowrap;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(15,23,42,.1);
  }

  /* ===== CARTÕES DAS DISCIPLINAS ===== */
  .menu{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .disc{
    display:flex;
    align-items:center;
    text-decoration:none;
    border-radius:22px;
    overflow:hidden;
    border:none;
    box-shadow:0 8px 28px rgba(15,23,42,.18);
    transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s;
    opacity:0;
    transform:translateY(14px);
    animation:fadeUp .5s ease forwards;
    position:relative;
    min-height:130px;
    padding:28px 26px 28px 30px;
    gap:20px;
  }
  .disc:hover{
    transform:translateY(-5px);
    box-shadow:0 22px 48px rgba(15,23,42,.25);
  }

  /* brilho interno */
  .disc::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, rgba(255,255,255,.18) 0%, transparent 55%);
    pointer-events:none;
    border-radius:22px;
  }

  .disc-bar{ display:none; }

  .disc-icon{
    width:72px;
    height:72px;
    border-radius:20px;
    background:rgba(255,255,255,.22);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    flex-shrink:0;
    backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.3);
  }

  .disc-text{ flex:1; }
  .disc-num{
    font-size:11px;
    font-weight:700;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:rgba(255,255,255,.7);
    margin-bottom:4px;
    display:block;
  }
  .disc-nome{
    font-family:"Fraunces", Georgia, serif;
    font-weight:700;
    font-size:clamp(1.6rem, 5vw, 2.1rem);
    line-height:1.15;
    color:#ffffff;
  }

  .disc-chev{
    font-size:22px;
    font-weight:900;
    color:rgba(255,255,255,.5);
    flex-shrink:0;
    transition:transform .2s, color .2s;
  }
  .disc:hover .disc-chev{
    color:#fff;
    transform:translateX(5px);
  }

  /* Cores por disciplina — fundos gradiente cheios */
  .d1{
    background:linear-gradient(135deg, #1d4ed8 0%, #2563eb 40%, #7c3aed 100%);
    box-shadow:0 8px 28px rgba(37,99,235,.45);
  }
  .d1:hover{ box-shadow:0 22px 48px rgba(37,99,235,.55); }

  .d2{
    background:linear-gradient(135deg, #b91c1c 0%, #dc2626 40%, #ea580c 100%);
    box-shadow:0 8px 28px rgba(220,38,38,.45);
  }
  .d2:hover{ box-shadow:0 22px 48px rgba(220,38,38,.55); }

  .d3{
    background:linear-gradient(135deg, #047857 0%, #059669 40%, #0891b2 100%);
    box-shadow:0 8px 28px rgba(5,150,105,.45);
  }
  .d3:hover{ box-shadow:0 22px 48px rgba(5,150,105,.55); }

  /* animações escalonadas */
  .disc:nth-child(1){ animation-delay:.08s; }
  .disc:nth-child(2){ animation-delay:.16s; }
  .disc:nth-child(3){ animation-delay:.24s; }

  @keyframes fadeUp{
    to{ opacity:1; transform:none; }
  }

  /* ===== RODAPÉ ===== */
  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:20px;
    font-size:12px;
    color:#94a3b8;
    letter-spacing:.05em;
  }

  @media (max-width:480px){
    header{ padding:36px 18px 32px; }
    .disc-icon{ width:48px; height:48px; font-size:22px; }
    .disc-nome{ font-size:1.1rem; }
    .disc-body{ padding:18px 16px 18px 16px; }
  }

  @media (prefers-reduced-motion:reduce){
    .disc{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>

<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-inner">
      <p class="sub">Materiais de aula</p>
      <h1>Professor Marcos Marinho</h1>
      <a class="lattes"
         href="http://lattes.cnpq.br/9869114671337490"
         target="_blank" rel="noopener">
        <span class="lattes-icon">🎓</span>
        Currículo Lattes
      </a>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main>
    <div class="section-label">
      <span>Disciplinas</span>
    </div>

    <div class="menu">

      <a class="disc d1" href="direito-individual-e-coletivo-do-trabalho/">
        <div class="disc-bar"></div>
        <div class="disc-body">
          <div class="disc-left">
            <div class="disc-icon">⚖️</div>
            <div class="disc-text">
              <div class="disc-num">Disciplina 1</div>
              <div class="disc-nome">Direito do Trabalho</div>
            </div>
          </div>
          <div class="disc-chev">›</div>
        </div>
      </a>

      <a class="disc d2" href="direito-processual-do-trabalho/">
        <div class="disc-bar"></div>
        <div class="disc-body">
          <div class="disc-left">
            <div class="disc-icon">🏛️</div>
            <div class="disc-text">
              <div class="disc-num">Disciplina 2</div>
              <div class="disc-nome">Direito Processual do Trabalho</div>
            </div>
          </div>
          <div class="disc-chev">›</div>
        </div>
      </a>

      <a class="disc d3" href="pratica-juridica-trabalhista/">
        <div class="disc-bar"></div>
        <div class="disc-body">
          <div class="disc-left">
            <div class="disc-icon">📝</div>
            <div class="disc-text">
              <div class="disc-num">Disciplina 3</div>
              <div class="disc-nome">Prática Jurídica Trabalhista</div>
            </div>
          </div>
          <div class="disc-chev">›</div>
        </div>
      </a>

    </div>
  </main>

  <footer>marcos-santos-marinho.github.io</footer>

</body>
</html>
